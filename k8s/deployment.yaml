apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployflow
  template:
    metadata:
      labels:
        app: deployflow
    spec:
      containers:
        - name: deployflow
          image: deepak97813/deployflow:IMAGE_TAG
          ports:
            - containerPort: 3000