apiVersion: apps/v1
kind: Deployment
metadata:
  name: APP_ID
spec:
  replicas: 2
  selector:
    matchLabels:
      app: APP_ID
  template:
    metadata:
      labels:
        app: APP_ID
    spec:
      containers:
        - name: APP_ID
          image: DOCKER_IMAGE
          imagePullPolicy: Always

          ports:
            - containerPort: APP_PORT

          envFrom:
            - configMapRef:
                name: APP_ID-config
            - secretRef:
                name: APP_ID-secret

          livenessProbe:
            httpGet:
              path: HEALTH_PATH
              port: APP_PORT
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: HEALTH_PATH
              port: APP_PORT
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"