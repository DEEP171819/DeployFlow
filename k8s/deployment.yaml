apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployflow
  template:
    metadata:
      labels:
        app: deployflow
    spec:
      containers:
  - name: deployflow
    image: deepak97813/deployflow:IMAGE_TAG
    ports:
      - containerPort: 3000

    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"