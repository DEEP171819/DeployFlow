apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: APP_ID-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /APP_ID(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: APP_ID-service
                port:
                  number: APP_PORT