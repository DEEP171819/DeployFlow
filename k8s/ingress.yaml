apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: APP_ID-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: APP_ID.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: APP_ID-service
                port:
                  number: APP_PORT