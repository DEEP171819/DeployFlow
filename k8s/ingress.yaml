apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: APP_ID-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: APP_ID.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: APP_ID-service
                port:
                  number: 3000