apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployflow
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployflow-ingress-reader
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployflow-ingress-reader
subjects:
  - kind: ServiceAccount
    name: deployflow
    namespace: default
roleRef:
  kind: ClusterRole
  name: deployflow-ingress-reader
  apiGroup: rbac.authorization.k8s.io