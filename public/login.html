<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployFlow - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>DeployFlow</h1>

            <h2>Login</h2>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
